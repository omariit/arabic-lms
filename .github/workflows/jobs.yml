name: Hourly housekeeping

# H6: calls POST /api/internal/jobs every hour. Inert unless JOBS_SECRET is set both
# here (as a repository secret) and on the deployed service — an unconfigured run
# simply gets a 503 and changes nothing.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  housekeeping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run housekeeping against staging
        if: ${{ secrets.JOBS_SECRET != '' && secrets.JOBS_URL != '' }}
        run: |
          code=$(curl -s -o /tmp/jobs.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.JOBS_SECRET }}" \
            "${{ secrets.JOBS_URL }}")
          cat /tmp/jobs.json
          test "$code" = "200"
